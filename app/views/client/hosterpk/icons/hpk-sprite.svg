<!-- HosterPK icon sprite (Story 2.5, UX-DR5 / architecture R8). Source: Bootstrap Icons
     1.13.1 (MIT), recolored to currentColor only - NO hardcoded fill/stroke (check.sh RULE 3).
     One inline <symbol> set, emitted once per page from structure.pdt; consumed via
     <svg class="hpk-icon"><use href="#hpk-icon-<name>"></use></svg> (partials/icon.pdt).
     "Subset to used" (NFR5): this curated inline sprite IS the subsetting mechanism (no full
     font, no CDN); every glyph maps to a NAMED near-term consumer below. The final nav-glyph
     vocabulary is Story 2.10 (e.g. house-door->speedometer2, person-circle->person-gear).
     LIVE consumers this story: moon + sun (the theme toggle).

     name -> near-term consumer (epic):
       house-door                -> Dashboard nav (E4; 2.10 may pick speedometer2)
       hdd-stack                 -> Services nav (E6)
       globe2                    -> Domains nav (E7)
       receipt                   -> Invoices nav (E5)
       credit-card               -> Billing / stored payment methods / account chip (E5,E9)
       life-preserver            -> Support nav (E8)
       person-circle             -> Profile / account chip (E9; 2.10 may pick person-gear)
       bell                      -> Notifications chrome (2.10)
       gear                      -> Account settings (E9)
       box-arrow-right           -> Logout (chrome, 2.10)
       check-circle-fill         -> success alert / badge leading-icon slot (2.4/2.7)
       exclamation-triangle-fill -> warning alert leading-icon slot (2.4/2.7)
       info-circle-fill          -> info alert leading-icon slot (2.4/2.7)
       x-circle-fill             -> danger/error alert leading-icon slot (2.4/2.7)
       chevron-down              -> account chip / dropdown disclosure (chrome, 2.10)
       moon                      -> theme toggle "switch to dark"  [LIVE, Story 2.5]
       sun                       -> theme toggle "switch to light" [LIVE, Story 2.5] -->
